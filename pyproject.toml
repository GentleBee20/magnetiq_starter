[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "magnetiq"
version = "0.1.0"
description = "Reproducible quantum-sensor measurement quality analysis"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8,<4", "numpy>=1.26,<3", "scipy>=1.12,<2", "mlflow>=3.7,<4"]

[project.scripts]
magnetiq = "magnetiq.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.13,<2", "scipy-stubs>=1.12,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["data", "reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
